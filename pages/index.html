<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>国际情报观察 · 静态日报快照</title>
  <meta name="description" content="国家安全与全球战略动态的公开情报快照。">
  <style>
    :root{color-scheme:light;--bg:#faf9f6;--paper:#fff;--ink:#202a30;--muted:#68747a;--line:#dfe5e1;--accent:#176b75;--hot:#b3402a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:980px;margin:auto;padding:48px 20px 72px}header{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:24px}h1{margin:0;font-size:clamp(26px,5vw,42px);letter-spacing:-.04em}h1 span{display:block;color:var(--accent);font-size:14px;letter-spacing:.08em;margin-bottom:8px}header p{max-width:340px;margin:0;color:var(--muted);font-size:13px}.meta{margin:24px 0 12px;color:var(--muted);font-size:12px}.feed{display:grid;gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;transition:border-color .15s}.card:hover{border-color:var(--accent)}.kicker{color:var(--accent);font-size:12px;font-weight:650}.card h2{font-size:18px;line-height:1.35;margin:5px 0 8px}.card h2 a{color:inherit;text-decoration:none}.card p{margin:0;color:#4f5b61}.source{margin-top:12px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px}.empty{padding:34px 20px;border:1px dashed var(--line);color:var(--muted);text-align:center;border-radius:12px}@media(max-width:620px){header{display:block}header p{margin-top:14px}.card h2{font-size:16px}}
  </style>
</head>
<body><main><header><h1><span>GLOBAL INTELLIGENCE WATCH</span>国际情报观察</h1><p>国家安全与全球战略动态。此页是 GitHub Pages 静态快照；实时采集、模型处理和完整历史请访问动态站点。</p></header><div class="meta" id="meta">正在读取快照…</div><section class="feed" id="feed" aria-live="polite"></section></main><script>
fetch('./data.json').then(r=>r.json()).then(({generatedAt,items=[]})=>{document.querySelector('#meta').textContent=`快照更新：${new Date(generatedAt).toLocaleString('zh-CN')} · ${items.length} 条公开精选`;const feed=document.querySelector('#feed');if(!items.length){feed.innerHTML='<div class="empty">当前快照暂无公开情报。动态站点启动采集后，下一次 Pages 发布会更新。</div>';return}feed.innerHTML=items.map(i=>`<article class="card"><div class="kicker">${esc(i.category||'国际动态')}</div><h2><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></h2><p>${esc(i.summary||'打开原文查看公开信息。')}</p><div class="source"><span>${esc(i.source)}</span><time>${fmt(i.publishedAt||i.discoveredAt)}</time></div></article>`).join('')});function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){const d=new Date(v);return Number.isNaN(d.valueOf())?'时间未知':d.toLocaleString('zh-CN',{dateStyle:'short',timeStyle:'short'})}
  </script></body></html>
